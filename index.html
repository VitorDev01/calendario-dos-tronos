<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Regência dos Tronos</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

<style>

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(circle at 20% 20%, rgba(60,80,180,.25), transparent 30%),
    radial-gradient(circle at 80% 40%, rgba(120,40,180,.20), transparent 30%),
    radial-gradient(circle at 50% 90%, rgba(255,215,0,.10), transparent 20%),
    #020611;

    background-attachment:fixed;

    font-family:'Cinzel',serif;
    color:white;
    min-height:100vh;
    overflow-x:hidden;

}

/* ESTRELAS */

body::before{

    content:"";

    position:fixed;

    top:0;
    left:0;
    width:100%;
    height:100%;

    background-image:
    radial-gradient(2px 2px at 20px 30px,#fff,transparent),
    radial-gradient(2px 2px at 100px 80px,#fff,transparent),
    radial-gradient(1px 1px at 200px 150px,#fff,transparent),
    radial-gradient(2px 2px at 350px 250px,#fff,transparent),
    radial-gradient(1px 1px at 500px 100px,#fff,transparent),
    radial-gradient(2px 2px at 700px 350px,#fff,transparent),
    radial-gradient(1px 1px at 900px 200px,#fff,transparent);

    background-size:1000px 1000px;

    opacity:.6;

    animation:starsMove 180s linear infinite;

    pointer-events:none;

}

@keyframes starsMove{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-1000px);
    }

}

/* CONTAINER */

.container{

    width:95%;
    max-width:1400px;

    margin:auto;

    padding:30px;

}

/* TITULO */

.titulo{

    text-align:center;

    color:#d4af37;

    font-size:3rem;

    margin-bottom:10px;

    text-shadow:
    0 0 10px rgba(212,175,55,.5),
    0 0 20px rgba(212,175,55,.3);

}

.subtitulo{

    text-align:center;

    color:#d9c78c;

    font-size:1rem;

    margin-bottom:30px;

}

/* MÊS */

.mes-atual{

    text-align:center;

    font-size:2rem;

    margin-bottom:20px;

    color:white;

    text-shadow:0 0 10px rgba(255,255,255,.3);

}

/* CALENDÁRIO */

#calendar{

    background:rgba(255,255,255,.95);

    color:#111;

    border:2px solid #d4af37;

    border-radius:20px;

    padding:25px;

    min-height:350px;

    box-shadow:
    0 0 20px rgba(212,175,55,.35),
    0 0 50px rgba(212,175,55,.15);

    backdrop-filter:blur(8px);

}

/* BOTÕES */

.botoes{

    display:flex;

    justify-content:center;

    gap:15px;

    margin-top:25px;

    flex-wrap:wrap;

}

button{

    padding:15px 25px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-size:1rem;

    font-weight:bold;

    background:#d4af37;

    color:#111;

    transition:.3s;

}

button:hover{

    transform:translateY(-4px);

    box-shadow:
    0 0 15px rgba(212,175,55,.6);

}

button:active{

    transform:scale(.98);

}

/* CARD RESULTADO */

.resultado{

    margin-top:40px;

    display:flex;

    gap:30px;

    background:rgba(9,20,45,.95);

    border:2px solid #d4af37;

    border-radius:20px;

    overflow:hidden;

    box-shadow:
    0 0 25px rgba(212,175,55,.15);

}

/* IMAGEM */

.imagem-box{

    width:450px;

    min-height:500px;

    overflow:hidden;

}

.imagem-box img{

    width:100%;

    height:100%;

    object-fit:cover;

    transition:.5s;

}

.imagem-box:hover img{

    transform:scale(1.03);

}

/* DADOS */

.dados{

    flex:1;

    padding:35px;

    display:flex;

    flex-direction:column;

    justify-content:center;

}

.dados h2{

    font-size:3rem;

    color:#d4af37;

    margin-bottom:20px;

    text-shadow:0 0 10px rgba(212,175,55,.4);

}

.info{

    font-size:1.15rem;

    margin-bottom:12px;

}

.info strong{

    color:#d4af37;

}

/* TRONO */

.trono{

    margin-top:25px;

    font-size:2.2rem;

    color:#ffd76b;

    text-shadow:0 0 10px rgba(255,215,107,.4);

}

/* DESCRIÇÃO */

.descricao{

    margin-top:10px;

    font-size:1.3rem;

    color:#e8cf7b;

    line-height:1.6;

}

/* CONTADOR */

.contador{

    margin-top:30px;

    padding:15px;

    border-left:4px solid #d4af37;

    background:#13244d;

    border-radius:5px;

}

.contador h3{

    margin-bottom:10px;

    color:#d4af37;

}

/* TABELA CALENDÁRIO */

#calendar{
    overflow-x:auto;
}

#calendar table{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
}

#calendar th,
#calendar td{
    width:14.28%;
    padding:8px 2px;
    text-align:center;
}

#calendar td:hover{

    background:#e8d39a;

}

/* SCROLL */

::-webkit-scrollbar{

    width:10px;

}

::-webkit-scrollbar-track{

    background:#09142d;

}

::-webkit-scrollbar-thumb{

    background:#d4af37;

    border-radius:10px;

}

@media(max-width:600px){

    #calendar{
        padding:10px;
    }

    #calendar th{
        font-size:.75rem;
        padding:8px 0;
    }

    #calendar td{
        font-size:.85rem;
        padding:10px 0;
    }

    .container{
        width:100%;
        padding:15px;
    }

}
/* RESPONSIVO */

@media(max-width:900px){

    .resultado{

        flex-direction:column;

    }

    .imagem-box{

        width:100%;

        min-height:300px;

    }

    .titulo{

        font-size:2rem;

    }

    .mes-atual{

        font-size:1.5rem;

    }

    .dados{

        padding:25px;

    }

    .dados h2{

        font-size:2rem;

    }

    .trono{

        font-size:1.7rem;

    }

}

</style>
</head>

<body>

<div class="container">

    <h1 class="titulo">
        REGÊNCIAS DOS TRONOS
    </h1>

    <p class="subtitulo">
        Calendário De Regências 12 tronos caidos
    </p>

    <div class="mes-atual">
        Junho 2026
    </div>

    <div id="calendar">

        <h2 style="text-align:center;">
            Calendário será gerado pelo JavaScript
        </h2>

    </div>

    <div class="botoes">

        <button id="btnAtual">
            👑 Analisar Regência Atual
        </button>

        <button id="btnData">
            📅 Ver Regência de Outra Data
        </button>

    </div>

    <div class="resultado">

        <div class="imagem-box">
            <img src="img/gemeos.jpg" alt="Regência Atual">
        </div>

        <div class="dados">

            <h2>
                ♊ GÊMEOS
            </h2>

            <div class="info">
                <strong>Elemento:</strong> Ar
            </div>

            <div class="info">
                <strong>Qualidade:</strong> Mutável
            </div>

            <div class="trono">
                👑 ATENA
            </div>

            <div class="descricao">
                A Soberba e a Estratégia
            </div>

            <div class="contador">

                <h3>
                    Próxima mudança de regência
                </h3>

                <p>
                    12 dias • 08 horas • 41 minutos
                </p>

            </div>

        </div>

    </div>

</div>
<script>

const regencias = [

{
inicio:{mes:1,dia:20},
signo:"Aquário",
elemento:"Ar",
qualidade:"Fixo",
trono:"Urano",
descricao:"O Despertar Caótico",
imagem:"img/aquario.jpg"
},

{
inicio:{mes:2,dia:19},
signo:"Peixes",
elemento:"Água",
qualidade:"Mutável",
trono:"Netuno",
descricao:"A Ilusão e a Desorientação",
imagem:"img/peixes.jpg"
},

{
inicio:{mes:3,dia:21},
signo:"Áries",
elemento:"Fogo",
qualidade:"Cardinal",
trono:"Marte",
descricao:"A Ira e a Guerra",
imagem:"img/aries.jpg"
},

{
inicio:{mes:4,dia:21},
signo:"Touro",
elemento:"Terra",
qualidade:"Fixo",
trono:"Afrodite",
descricao:"A Luxúria e o Desejo",
imagem:"img/touro.jpg"
},

{
inicio:{mes:5,dia:22},
signo:"Gêmeos",
elemento:"Ar",
qualidade:"Mutável",
trono:"Atena",
descricao:"A Soberba e a Estratégia",
imagem:"img/gemeos.jpg"
},

{
inicio:{mes:6,dia:21},
signo:"Câncer",
elemento:"Água",
qualidade:"Cardinal",
trono:"Lilith",
descricao:"A Rebelião e o Instinto",
imagem:"img/cancer.jpg"
},

{
inicio:{mes:7,dia:23},
signo:"Leão",
elemento:"Fogo",
qualidade:"Fixo",
trono:"Apolo",
descricao:"O Orgulho e a Vaidade",
imagem:"img/leao.jpg"
},

{
inicio:{mes:8,dia:22},
signo:"Virgem",
elemento:"Terra",
qualidade:"Mutável",
trono:"Mercúrio",
descricao:"A Manipulação e o Engano",
imagem:"img/virgem.jpg"
},

{
inicio:{mes:9,dia:23},
signo:"Libra",
elemento:"Ar",
qualidade:"Cardinal",
trono:"Têmis",
descricao:"A Corrupção da Justiça",
imagem:"img/libra.jpg"
},

{
inicio:{mes:10,dia:24},
signo:"Escorpião",
elemento:"Água",
qualidade:"Fixo",
trono:"Hades",
descricao:"A Ambição e a Destruição",
imagem:"img/escorpiao.jpg"
},

{
inicio:{mes:11,dia:21},
signo:"Sagitário",
elemento:"Fogo",
qualidade:"Mutável",
trono:"Zeus",
descricao:"O Abuso do Poder",
imagem:"img/sagitario.jpg"
},

{
inicio:{mes:12,dia:22},
signo:"Capricórnio",
elemento:"Terra",
qualidade:"Cardinal",
trono:"Saturno",
descricao:"A Crueldade e o Controle",
imagem:"img/capricornio.jpg"
}

];

function obterRegencia(data){

let mes = data.getMonth()+1;
let dia = data.getDate();

let atual = regencias[regencias.length-1];

for(let reg of regencias){

if(
mes > reg.inicio.mes ||
(
mes === reg.inicio.mes &&
dia >= reg.inicio.dia
)
){
atual = reg;
}
}

return atual;
}

function analisarAtual(){

const hoje = new Date();

const reg = obterRegencia(hoje);

document.querySelector(".dados h2").textContent =
reg.signo.toUpperCase();

document.querySelector(".info:nth-child(2)").innerHTML =
"<strong>Elemento:</strong> " + reg.elemento;

document.querySelector(".info:nth-child(3)").innerHTML =
"<strong>Qualidade:</strong> " + reg.qualidade;

document.querySelector(".trono").innerHTML =
"👑 " + reg.trono;

document.querySelector(".descricao").textContent =
reg.descricao;

document.querySelector(".imagem-box img").src =
reg.imagem;
}

function gerarCalendario(){

const calendar =
document.getElementById("calendar");

const hoje =
new Date();

const ano =
hoje.getFullYear();

const mes =
hoje.getMonth();

const primeiroDia =
new Date(ano,mes,1);

const ultimoDia =
new Date(ano,mes+1,0);

let html = `
<table style="width:100%;text-align:center;border-collapse:collapse;">
<tr>
<th>Dom</th>
<th>Seg</th>
<th>Ter</th>
<th>Qua</th>
<th>Qui</th>
<th>Sex</th>
<th>Sáb</th>
</tr>
<tr>
`;

for(let i=0;i<primeiroDia.getDay();i++){

html += "<td></td>";

}

for(let dia=1;dia<=ultimoDia.getDate();dia++){

let dataAtual =
new Date(ano,mes,dia);

if(dataAtual.getDay()===0 && dia!==1){

html += "</tr><tr>";

}

let estilo = "";

if(dia===hoje.getDate()){

estilo = `
background:#d4af37;
color:black;
font-weight:bold;
border-radius:50%;
`;

}

html += `
<td style="
padding:12px;
${estilo}
">
${dia}
</td>
`;

}

html += `
</tr>
</table>
`;

calendar.innerHTML = html;

const meses = [
"Janeiro","Fevereiro","Março",
"Abril","Maio","Junho",
"Julho","Agosto","Setembro",
"Outubro","Novembro","Dezembro"
];

document.querySelector(".mes-atual").textContent =
meses[mes] + " " + ano;
}

document
.getElementById("btnAtual")
.addEventListener(
"click",
analisarAtual
);

gerarCalendario();
analisarAtual();

</script>
</body>
</html>
